<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Monkey Merge</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
<style>
  :root{
    --bg1:#fff1dc; --bg2:#ffe0b0; --cup:#fffaf2; --cuprim:#d9b483;
    --ink:#5a3b22; --accent:#e07a3c;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    font-family:"Hiragino Maru Gothic ProN","Yu Gothic UI",system-ui,sans-serif;
    background:radial-gradient(120% 100% at 50% 0%,var(--bg1) 0%,var(--bg2) 70%,#ffce8e 100%);
    color:var(--ink); min-height:100dvh;
    display:flex; align-items:center; justify-content:center;
    padding:14px; overflow:hidden; touch-action:none;
  }
  .wrap{ width:100%; max-width:420px; display:flex; flex-direction:column; gap:10px; }
  header{ display:flex; align-items:center; justify-content:space-between; gap:8px; }
  .title{ font-size:23px; font-weight:800; letter-spacing:.02em; white-space:nowrap;
    display:flex; align-items:center; gap:6px; text-shadow:0 2px 0 #fff7; }
  .title .ico{ filter:drop-shadow(0 2px 2px #0002); }
  .scores{ display:flex; gap:8px; }
  .pill{ background:#fff8; border:2px solid #fff; border-radius:14px;
    padding:6px 12px; min-width:78px; text-align:center; box-shadow:0 3px 0 #e6c68a; }
  .pill .lbl{ font-size:10px; font-weight:700; opacity:.7; letter-spacing:.1em; }
  .pill .val{ font-size:20px; font-weight:800; line-height:1; }

  .stage{ position:relative; background:var(--cup);
    border:5px solid var(--cuprim); border-top:none;
    border-radius:6px 6px 26px 26px;
    box-shadow:inset 0 -10px 20px #00000010, 0 10px 24px #b07a2a44;
    overflow:hidden; touch-action:none; }
  canvas{ display:block; width:100%; height:auto; }

  .nextbar{ display:flex; align-items:center; gap:10px;
    background:#fff8; border:2px solid #fff; border-radius:16px; padding:8px 12px;
    box-shadow:0 3px 0 #e6c68a; }
  .nextbar .label{ font-size:12px; font-weight:800; opacity:.75; }
  .nextbar .dot{ width:34px; height:34px; border-radius:50%;
    display:grid; place-items:center; font-size:20px; line-height:1;
    box-shadow:inset 0 -3px 6px #00000022; }
  .hint{ margin-left:auto; font-size:11px; opacity:.65; font-weight:700; }

  .chain{ display:flex; flex-wrap:wrap; align-items:center; gap:3px;
    justify-content:center; opacity:.9; }
  .chain .cm{ border-radius:50%; display:inline-grid; place-items:center;
    line-height:1; box-shadow:inset 0 -2px 4px #00000022, 0 1px 1px #0001; }
  .chain .arw{ font-size:9px; opacity:.5; }

  .overlay{ position:absolute; inset:0; display:none; place-items:center;
    background:#3a210bcc; backdrop-filter:blur(2px); border-radius:0 0 22px 22px; }
  .overlay.show{ display:grid; }
  .panel{ background:#fffaf0; border-radius:20px; padding:22px 26px; text-align:center;
    box-shadow:0 12px 30px #0006; transform:scale(.9); animation:pop .35s ease forwards; }
  @keyframes pop{to{transform:scale(1)}}
  .panel h2{ font-size:24px; margin-bottom:4px; }
  .panel .big{ font-size:40px; font-weight:800; color:var(--accent); line-height:1.1; margin:6px 0; }
  .panel .sub{ font-size:12px; opacity:.7; margin-bottom:14px; }
  .btn{ font:inherit; font-weight:800; font-size:16px; cursor:pointer;
    background:var(--accent); color:#fff; border:none; border-radius:14px;
    padding:11px 26px; box-shadow:0 4px 0 #b1561f; transition:transform .08s; }
  .btn:active{ transform:translateY(3px); box-shadow:0 1px 0 #b1561f; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="title"><span class="ico">🐵</span>Monkey Merge</div>
    <div class="scores">
      <div class="pill"><div class="lbl">SCORE</div><div class="val" id="score">0</div></div>
      <div class="pill"><div class="lbl">BEST</div><div class="val" id="best">0</div></div>
    </div>
  </header>

  <div class="stage" id="stage">
    <canvas id="cv"></canvas>
    <div class="overlay" id="overlay">
      <div class="panel">
        <h2>ゲームオーバー</h2>
        <div class="big" id="finalScore">0</div>
        <div class="sub" id="resultMsg">お猿さんが積もりすぎました</div>
        <button class="btn" id="restart">もう一度あそぶ</button>
      </div>
    </div>
  </div>

  <div class="nextbar">
    <span class="label">NEXT</span>
    <span class="dot" id="nextDot">🐵</span>
    <span class="hint">タップ／クリックで落とす</span>
  </div>

  <div class="chain" id="chain"></div>
</div>

<script>
const { Engine, World, Bodies, Body, Events, Composite } = Matter;

// ---- お猿さん定義（小→大）。色違いのオリジナルキャラ ----
const MONKEYS = [
  { name:"ちびざる",   r:16,  color:"#f3d9bf" },
  { name:"こざる",     r:23,  color:"#f0c4a0" },
  { name:"きいろざる", r:30,  color:"#f4b740" },
  { name:"ももざる",   r:38,  color:"#e79ac0" },
  { name:"ちゃざる",   r:46,  color:"#d99a6c" },
  { name:"こげざる",   r:54,  color:"#b5784a" },
  { name:"みどりざる", r:64,  color:"#7fc59a" },
  { name:"そらざる",   r:74,  color:"#7fb4e0" },
  { name:"ふじざる",   r:86,  color:"#9f8fd4" },
  { name:"あかざる",   r:100, color:"#e0795a" },
  { name:"キングざる", r:116, color:"#8a7be0" },
];
const MAX = MONKEYS.length - 1;
const SPAWNABLE = 5;       // 落とせるのは最初の5種
const FACE = "#fff3e6";    // 共通の薄いお顔の色

// ---- 盤面 ----
const W = 380, H = 580;
const DEATH_Y = 102;
const SPAWN_Y = 48;

const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const dpr = Math.min(window.devicePixelRatio || 1, 2);
cv.width = W * dpr; cv.height = H * dpr;
cv.style.aspectRatio = W + " / " + H;
ctx.scale(dpr, dpr);

// ---- 物理エンジン ----
const engine = Engine.create();
engine.world.gravity.y = 1.1;
engine.positionIterations = 10;
engine.velocityIterations = 10;
const world = engine.world;
const wallT = 80;
World.add(world, [
  Bodies.rectangle(-wallT/2, H/2, wallT, H*2, { isStatic:true, friction:0.4 }),
  Bodies.rectangle(W+wallT/2, H/2, wallT, H*2, { isStatic:true, friction:0.4 }),
  Bodies.rectangle(W/2, H+wallT/2, W*2, wallT, { isStatic:true, friction:0.5 }),
]);

// ---- 状態 ----
let score = 0, best = 0, gameOver = false;
let canDrop = true;
let ghost = { level: rndLevel(), x: W/2 };
let nextLevel = rndLevel();
let particles = [];

const scoreEl = document.getElementById('score');
const bestEl  = document.getElementById('best');
const nextDot = document.getElementById('nextDot');
const overlay = document.getElementById('overlay');

function rndLevel(){ return Math.floor(Math.random() * SPAWNABLE); }

function updateNextUI(){
  nextDot.style.background = MONKEYS[nextLevel].color + "cc";
}
updateNextUI();

function makeMonkey(level, x, y, vx=0){
  const m = MONKEYS[level];
  const body = Bodies.circle(x, y, m.r, {
    restitution: 0.18, friction: 0.5, frictionStatic: 0.9, density: 0.0014, slop: 0.02,
  });
  body.lvl = level;
  body.merged = false;
  body.birth = performance.now();
  body.overTime = 0;
  Body.setVelocity(body, { x:vx, y:0 });
  World.add(world, body);
  return body;
}

// ---- 落下 ----
function drop(){
  if (!canDrop || gameOver) return;
  canDrop = false;
  const lvl = ghost.level;
  const x = clampX(ghost.x, MONKEYS[lvl].r);
  makeMonkey(lvl, x, SPAWN_Y);
  setTimeout(() => {
    ghost = { level: nextLevel, x: ghost.x };
    nextLevel = rndLevel();
    updateNextUI();
    canDrop = true;
  }, 500);
}
function clampX(x, r){ return Math.max(r+2, Math.min(W-r-2, x)); }

// ---- 合体 ----
Events.on(engine, 'collisionStart', (e) => {
  for (const p of e.pairs){
    const a = p.bodyA, b = p.bodyB;
    if (a.lvl === undefined || b.lvl === undefined) continue;
    if (a.merged || b.merged) continue;
    if (a.lvl !== b.lvl) continue;

    a.merged = b.merged = true;
    const lvl = a.lvl;
    const nx = (a.position.x + b.position.x) / 2;
    const ny = (a.position.y + b.position.y) / 2;
    World.remove(world, a);
    World.remove(world, b);
    burst(nx, ny, MONKEYS[lvl].color);

    if (lvl < MAX){
      makeMonkey(lvl + 1, nx, ny);
      addScore((lvl + 1) * (lvl + 2) / 2);
    } else {
      addScore(100);
      burst(nx, ny, "#ffce4a", 18);
    }
  }
});

function addScore(n){
  score += n;
  scoreEl.textContent = score;
  if (score > best){ best = score; bestEl.textContent = best; }
}

// ---- パーティクル ----
function burst(x, y, color, count=9){
  for (let i=0;i<count;i++){
    const a = Math.random()*Math.PI*2, sp = 1.5 + Math.random()*3.5;
    particles.push({ x, y, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp-1,
      life:1, color, r:2+Math.random()*3 });
  }
}
function stepParticles(dt){
  for (const pt of particles){
    pt.x += pt.vx; pt.y += pt.vy; pt.vy += 0.18; pt.life -= dt/450;
  }
  particles = particles.filter(p => p.life > 0);
}

// ---- ゲームオーバー判定 ----
function checkGameOver(now, dt){
  for (const body of Composite.allBodies(world)){
    if (body.lvl === undefined) continue;
    if (now - body.birth < 1400) continue;
    const top = body.position.y - MONKEYS[body.lvl].r;
    if (top < DEATH_Y && Math.abs(body.velocity.y) < 1.2){
      body.overTime += dt;
      if (body.overTime > 1500){ endGame(); return; }
    } else {
      body.overTime = 0;
    }
  }
}
function endGame(){
  gameOver = true;
  document.getElementById('finalScore').textContent = score;
  document.getElementById('resultMsg').textContent =
    score >= 800 ? "お猿の王者！お見事！" :
    score >= 300 ? "なかなかの腕前！" : "お猿さんが積もりすぎました";
  overlay.classList.add('show');
}
function restart(){
  for (const body of Composite.allBodies(world)){
    if (body.lvl !== undefined) World.remove(world, body);
  }
  particles = []; score = 0; gameOver = false; canDrop = true;
  scoreEl.textContent = 0;
  ghost = { level: rndLevel(), x: W/2 };
  nextLevel = rndLevel(); updateNextUI();
  overlay.classList.remove('show');
}
document.getElementById('restart').addEventListener('click', restart);

// ---- 入力 ----
function pointerX(e){
  const rect = cv.getBoundingClientRect();
  const cx = (e.touches ? e.touches[0].clientX : e.clientX);
  return (cx - rect.left) / rect.width * W;
}
function onMove(e){ if (!gameOver) ghost.x = clampX(pointerX(e), MONKEYS[ghost.level].r); }
cv.addEventListener('mousemove', onMove);
cv.addEventListener('touchmove', (e)=>{ e.preventDefault(); onMove(e); }, {passive:false});
cv.addEventListener('mousedown', onMove);
cv.addEventListener('click', drop);
cv.addEventListener('touchstart', (e)=>{ e.preventDefault(); onMove(e); }, {passive:false});
cv.addEventListener('touchend', (e)=>{ e.preventDefault(); drop(); }, {passive:false});

// ---- 可愛いお猿さんを描く ----
function drawMonkey(x, y, level, angle){
  const m = MONKEYS[level], r = m.r, fur = m.color;
  ctx.save();
  ctx.translate(x, y); ctx.rotate(angle || 0);

  // 耳
  const earR = r*0.42;
  for (const sx of [-1, 1]){
    ctx.beginPath(); ctx.arc(sx*r*0.78, -r*0.42, earR, 0, Math.PI*2);
    ctx.fillStyle = fur; ctx.fill();
    ctx.strokeStyle = "#00000018"; ctx.lineWidth = 1.5; ctx.stroke();
    ctx.beginPath(); ctx.arc(sx*r*0.78, -r*0.42, earR*0.55, 0, Math.PI*2);
    ctx.fillStyle = FACE; ctx.fill();
  }
  // 頭
  ctx.beginPath(); ctx.arc(0,0,r,0,Math.PI*2);
  const g = ctx.createRadialGradient(-r*0.3,-r*0.35,r*0.2,0,0,r);
  g.addColorStop(0, lighten(fur,28)); g.addColorStop(1, fur);
  ctx.fillStyle = g; ctx.fill();
  ctx.strokeStyle = "#00000022"; ctx.lineWidth = 2; ctx.stroke();
  // お顔（薄い面）
  ctx.beginPath(); ctx.ellipse(0, r*0.16, r*0.64, r*0.58, 0, 0, Math.PI*2);
  ctx.fillStyle = FACE; ctx.fill();
  // ほっぺ
  ctx.fillStyle = "rgba(255,140,140,0.45)";
  ctx.beginPath(); ctx.arc(-r*0.46, r*0.18, r*0.13, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc( r*0.46, r*0.18, r*0.13, 0, Math.PI*2); ctx.fill();
  // 目
  const eyeY = -r*0.06, eyeX = r*0.3, eyeR = r*0.13;
  ctx.fillStyle = "#3a2a20";
  ctx.beginPath(); ctx.arc(-eyeX, eyeY, eyeR, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc( eyeX, eyeY, eyeR, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = "#fff";
  ctx.beginPath(); ctx.arc(-eyeX+eyeR*0.32, eyeY-eyeR*0.32, eyeR*0.38, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc( eyeX+eyeR*0.32, eyeY-eyeR*0.32, eyeR*0.38, 0, Math.PI*2); ctx.fill();
  // 鼻
  ctx.fillStyle = "#c98f6e";
  ctx.beginPath(); ctx.ellipse(0, r*0.2, r*0.1, r*0.07, 0, 0, Math.PI*2); ctx.fill();
  // 口（にっこり）
  ctx.strokeStyle = "#9a6b4a"; ctx.lineWidth = Math.max(1.5, r*0.045); ctx.lineCap = "round";
  ctx.beginPath(); ctx.arc(0, r*0.22, r*0.2, 0.15*Math.PI, 0.85*Math.PI); ctx.stroke();
  // キングざるには王冠
  if (level === MAX){
    ctx.fillStyle = "#ffd24a";
    ctx.strokeStyle = "#e0a91e"; ctx.lineWidth = 2;
    const cw = r*1.0, cy = -r*0.84, ch = r*0.34;
    ctx.beginPath();
    ctx.moveTo(-cw/2, cy);
    ctx.lineTo(-cw/2, cy-ch*0.5);
    ctx.lineTo(-cw/4, cy);
    ctx.lineTo(0, cy-ch);
    ctx.lineTo(cw/4, cy);
    ctx.lineTo(cw/2, cy-ch*0.5);
    ctx.lineTo(cw/2, cy);
    ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.fillStyle = "#ff5e5e";
    ctx.beginPath(); ctx.arc(0, cy-ch*0.35, r*0.06, 0, Math.PI*2); ctx.fill();
  }
  ctx.restore();
}
function lighten(hex, amt){
  const n = parseInt(hex.slice(1),16);
  let r=(n>>16)+amt, g=((n>>8)&255)+amt, b=(n&255)+amt;
  r=Math.min(255,r); g=Math.min(255,g); b=Math.min(255,b);
  return "#"+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1);
}

let danger = 0;
function render(now){
  ctx.clearRect(0,0,W,H);
  const bg = ctx.createLinearGradient(0,0,0,H);
  bg.addColorStop(0,"#fffdf6"); bg.addColorStop(1,"#fff1da");
  ctx.fillStyle = bg; ctx.fillRect(0,0,W,H);

  let maxTop = H;
  for (const body of Composite.allBodies(world)){
    if (body.lvl === undefined) continue;
    maxTop = Math.min(maxTop, body.position.y - MONKEYS[body.lvl].r);
  }
  const near = maxTop < DEATH_Y + 60;
  danger += ((near?1:0) - danger) * 0.1;
  ctx.save();
  ctx.setLineDash([8,8]); ctx.lineWidth = 2;
  ctx.strokeStyle = `rgba(224,122,60,${0.35 + danger*0.5*(0.6+0.4*Math.sin(now/200))})`;
  ctx.beginPath(); ctx.moveTo(0,DEATH_Y); ctx.lineTo(W,DEATH_Y); ctx.stroke();
  ctx.restore();

  for (const body of Composite.allBodies(world)){
    if (body.lvl === undefined) continue;
    drawMonkey(body.position.x, body.position.y, body.lvl, body.angle);
  }

  for (const pt of particles){
    ctx.globalAlpha = Math.max(0, pt.life);
    ctx.fillStyle = pt.color;
    ctx.beginPath(); ctx.arc(pt.x, pt.y, pt.r, 0, Math.PI*2); ctx.fill();
  }
  ctx.globalAlpha = 1;

  if (canDrop && !gameOver){
    const r = MONKEYS[ghost.level].r;
    const gx = clampX(ghost.x, r);
    ctx.save();
    ctx.globalAlpha = 0.25; ctx.strokeStyle = "#b07a2a"; ctx.lineWidth = 2;
    ctx.setLineDash([4,6]);
    ctx.beginPath(); ctx.moveTo(gx, SPAWN_Y+r); ctx.lineTo(gx, H); ctx.stroke();
    ctx.restore();
    drawMonkey(gx, SPAWN_Y, ghost.level, 0);
  }
}

// ---- メインループ ----
let last = performance.now();
function loop(now){
  let dt = now - last; last = now;
  dt = Math.min(dt, 50);
  if (!gameOver){
    Engine.update(engine, 1000/60);
    checkGameOver(now, dt);
  }
  stepParticles(dt);
  render(now);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

// ---- 進化チェーン表示 ----
const chain = document.getElementById('chain');
MONKEYS.forEach((m,i)=>{
  const s = document.createElement('span'); s.className = 'cm';
  const sz = 14 + i*1.7;
  s.style.width = sz+'px'; s.style.height = sz+'px';
  s.style.background = m.color; s.style.fontSize = (sz*0.6)+'px';
  s.textContent = '🐵';
  chain.appendChild(s);
  if (i < MONKEYS.length-1){ const a=document.createElement('span'); a.className='arw'; a.textContent='▸'; chain.appendChild(a); }
});
</script>
</body>
</html>
